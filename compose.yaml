name: sja
services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sja
      POSTGRES_USER: sja
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sja -d sja"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    image: ${BACKEND_IMAGE:-sja-backend:local}
    build: ../sja-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sja:${POSTGRES_PASSWORD}@db:5432/sja?sslmode=disable
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      DATA_DIR: /data
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3031}:8080"
    volumes:
      - backend_data:/data
    depends_on:
      db:
        condition: service_healthy
  frontend:
    image: ${FRONTEND_IMAGE:-sja-frontend:local}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3030}:3000"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  backend_data:
